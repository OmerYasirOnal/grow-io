// ═══ PRIVACY PRIMER (pre-ATT explainer) ═══
// Shown once, on the menu, after the tutorial and daily modal are out of the
// way, when the host reports that the iOS tracking prompt has not been answered
// yet. One neutral button: the system prompt always follows, and the game never
// gates anything on the answer (App Store guidelines 5.1.1 / 3.2.2).
function wrapLines(text,maxW){
  const words=text.split(' '),lines=[];let cur='';
  for(let i=0;i<words.length;i++){
    const t=cur?cur+' '+words[i]:words[i];
    if(cur&&ctx.measureText(t).width>maxW){lines.push(cur);cur=words[i];}else cur=t;
  }
  if(cur)lines.push(cur);
  return lines;
}

// full-screen ad intercepts every touch, so a touch that still reaches the
// canvas well after AD_OPENED proves the ad is gone and its AD_CLOSED was lost:
// recover instead of leaving the game frozen forever.
function adBlocksInput(){

  if(performance.now()-adOpenAt<1500)return true;
  adOpen=false;rewardPendingT=0;lastAdClosedAt=performance.now();

// review request at a happy moment.

  if(us!==lastUiState){
    lastUiState=us;postMsg({type:'UI_STATE',data:us});
    // Review ask: after a new personal best, back on the menu, never right after an ad.
    if(us==='menu'&&reviewWanted&&!reviewAsked&&performance.now()-lastAdClosedAt>30000){
      reviewAsked=true;reviewWanted=false;postMsg({type:'REQUEST_REVIEW'});

function deathLayout(){
  const uh=H-sat-sab,oy=sat;
  const k=Math.max(0.74,Math.min(1,uh/720));
  const bw=Math.min(300,W-40),bx=W/2-bw/2,bh=Math.round(50*k),mh=Math.round(42*k),gap=Math.round(10*k);
  // No revive after a Rush timeout: the clock is still expired, so a revived

  const canRevive=!hasRevived&&killerName!=='time';
  const showDouble=lastRunEarned>0&&!doubleClaimed;
  // Buttons are anchored to the bottom, the result block is centred above them.
  const menu={x:bx,y:H-sab-Math.round(16*k)-mh,w:bw,h:mh};
  const again={x:bx,y:menu.y-gap-bh,w:bw,h:bh};

  const btnTop=(revive||again).y;

  // settleRun already folded this run into bestByMode, so equality means this
  // run set the record.
  const isNewModeBest=(runMetricDs>0&&runMetricDs===currentModeBest);
  if(isNewModeBest){
    ctx.fillStyle='#ffd600';ctx.shadowColor='#ffd600';ctx.shadowBlur=10;ctx.font='900 '+Math.round(17*k)+'px Orbitron';
    glyphText('★︎ '+L.newBest+' ★︎',W/2,dl.rankY);ctx.shadowBlur=0;
  }else if(mode==='classic'&&currentRank>0&&currentRank<=10){
    const col=currentRank===1?'#ffd600':(currentRank<=3?'#c0c0c0':'#00e5ff');
    ctx.fillStyle=col;ctx.font='900 '+Math.round(15*k)+'px Orbitron';
    ctx.fillText(L.topRank.replace('{n}',currentRank),W/2,dl.rankY);
  }else if(currentModeBest>0){
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='600 13px Rajdhani';
    ctx.fillText(L.modeBest+': '+formatModeBest(mode,currentModeBest),W/2,dl.rankY);
  }
  // Tier line: current named tier (from the CLASSIC best) and the next one.
  {const tr=tierForScore(highScore),nt=nextTier(highScore);
  ctx.font='700 12px Rajdhani';ctx.fillStyle=tr.color;
  ctx.fillText(L.tier+': '+tierName(tr)+(nt?'   ·   '+L.nextTier+': '+tierName(nt)+' @ '+fmtN(nt.min):''),W/2,dl.tierY,W-32);}
  // ── Buttons ──
  if(dl.revive){
    const r=dl.revive,ready=adReady.rewarded,loading=!ready&&adReady.rewardedLoading;
    ctx.globalAlpha=A*(ready?1:(loading?0.55:0.35));
    ctx.fillStyle='#7c4dff';ctx.shadowColor='#7c4dff';ctx.shadowBlur=ready?12:0;rr(r.x,r.y,r.w,r.h,r.h/2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='900 '+Math.round(16*k)+'px Orbitron';
    ctx.fillText(loading?L.adLoading:L.watchRevive,W/2,r.y+r.h*0.64,r.w-24);
    ctx.globalAlpha=A;
    if(adFailedMsg>0){
      adFailedMsg-=gdt;
      ctx.fillStyle='rgba(255,100,100,'+(Math.min(adFailedMsg,1))+')';ctx.font='600 13px Rajdhani';
      ctx.fillText(L.adNotAvailable,W/2,r.y-6,r.w);
    }
  }
  {const r=dl.again;
  ctx.fillStyle='#00e5ff';ctx.shadowColor='#00e5ff';ctx.shadowBlur=10;rr(r.x,r.y,r.w,r.h,r.h/2);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#0a0a1a';ctx.font='900 '+Math.round(17*k)+'px Orbitron';glyphText('▶︎ '+L.playAgain,W/2,r.y+r.h*0.64,r.w-24);}
  {const r=dl.menu;
  ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=2;rr(r.x,r.y,r.w,r.h,r.h/2);ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,0.85)';ctx.font='700 15px Rajdhani';ctx.fillText(L.mainMenu,W/2,r.y+r.h*0.64);}
  ctx.globalAlpha=1;
  ctx.textAlign='left';
}

// ═══ SHOP (skins + trails) ═══
// shopLayout() is the single source of truth for the shop header, the preview
// panel and the skin grid: the draw code and the tap handlers both read it.
let shopSel=0;        // skin index shown in the preview panel
let trialSkin=-1;     // hero skin granted for the next run by a rewarded ad
let pendingTrial=-1;  // skin the in-flight 'trial' ad is for
let shopTouch=null;   // {x,y,moved,grid}: tells a tap from a scroll on the grid
function fmtN(n){return (''+Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,isTR?'.':',');}
function openShop(){state='skinselect';skinScroll=0;shopSel=currentSkin;shopTouch=null;resetTouchState();}
function shopLayout(){
  const oy=sat,uh=H-sat-sab;
  const back={x:12,y:oy+12,w:84,h:40};
  const tabW=Math.min(300,W-32),tabs={x:W/2-tabW/2,y:oy+62,w:tabW,h:36};
  const pvH=Math.max(148,Math.min(172,Math.floor(uh*0.23)));
  const pv={x:16,y:tabs.y+tabs.h+12,w:W-32,h:pvH};
  const btnW=Math.min(150,Math.floor(pv.w*0.44)),btnH=40;
  const btn={x:pv.x+pv.w-btnW-12,y:pv.y+pv.h-btnH-12,w:btnW,h:btnH};
  const adBtn={x:pv.x+12,y:btn.y,w:pv.w-btnW-36,h:btnH};
  const cols=W>=340?4:3,gap=8;
  const gx=16,cw=(W-32-gap*(cols-1))/cols,ch=Math.round(cw*0.82)+20;
  const gy=pv.y+pv.h+12,gh=H-sab-gy;
  const rows=Math.ceil(SKINS.length/cols);
  const maxScroll=Math.max(0,rows*(ch+gap)-gap+14-gh);
  return {back:back,tabs:tabs,pv:pv,btn:btn,adBtn:adBtn,cols:cols,gap:gap,gx:gx,gy:gy,gh:gh,cw:cw,ch:ch,maxScroll:maxScroll};
}
function shopCellRect(sl,i){
  const row=Math.floor(i/sl.cols),col=i%sl.cols;
  return {x:sl.gx+col*(sl.cw+sl.gap),y:sl.gy+row*(sl.ch+sl.gap)-skinScroll,w:sl.cw,h:sl.ch};
}
// What the preview panel offers for a skin: one state drives both the button
// drawing and the tap handler.
function shopSkinState(idx){
  const sk=SKINS[idx],owned=unlockedSkins.includes(idx),price=featuredSkinPrice(idx);
  const canBuy=!owned&&price>0&&coins>=price;
  const adLeft=coinAdsLeft();
  return {sk:sk,owned:owned,equipped:owned&&idx===currentSkin,price:price,canBuy:canBuy,
    short:(!owned&&price>0)?Math.max(0,price-coins):0,
    // Hero skins can be tried for one run via a rewarded ad (try before you buy).
    trial:!owned&&!!sk.power,
    showAd:!owned&&!sk.power&&price>0&&!canBuy&&adLeft>0,adReward:coinAdReward(coinAdCount),
    earnAt:(!owned&&skinRail(sk)==='earn')?parseInt(sk.u.slice(1)):0};
}
// Colour of body segment i (0 = head) of a skin, for every static preview.
function skinSegColor(skin,i,n){
  if(skin.p==='rainbow')return hsl((i*24+frameCount*2)%360,80,60);
  if(skin.p==='striped')return ((i/2)|0)%2===0?skin.c[0]:skin.c[1];
  return lerpColor(skin.c[0],skin.c[1]||skin.c[0],i/Math.max(1,n-1));
}
// A small wiggling snake wearing `skin`: menu hero, shop preview and shop cards.
function drawSnakePreview(skin,cx,cy,span,rad,n,amp){
  const tt=reducedMotion?0:performance.now()*0.0032;
  for(let i=n-1;i>=0;i--){
    const t=i/(n-1);
    const x=cx+span/2-t*span,y=cy+Math.sin(tt-i*0.42)*amp*(0.35+t*0.65),r=rad*(1-t*0.47);
    ctx.fillStyle=skinSegColor(skin,i,n);
    ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
    if(skin.p==='dotted'&&i%3===0&&i>0){ctx.fillStyle='rgba(255,255,255,0.4)';ctx.beginPath();ctx.arc(x,y,r*0.4,0,TAU);ctx.fill();}
  }
  const hx=cx+span/2,hy=cy+Math.sin(tt)*amp*0.35,e=rad/9.5;
  if(skin.power){
    const tx=cx-span/2,ty=cy+Math.sin(tt-(n-1)*0.42)*amp;
    drawHeroAccessory(skin.power,hx,hy,0,rad*2,true,false,{x:tx,y:ty,px:tx+span/(n-1),py:ty});
  }
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx+3*e,hy-4*e,2.8*e,0,TAU);ctx.arc(hx+3*e,hy+4*e,2.8*e,0,TAU);ctx.fill();
  ctx.fillStyle='#0a0a1a';ctx.beginPath();ctx.arc(hx+4*e,hy-4*e,1.3*e,0,TAU);ctx.arc(hx+4*e,hy+4*e,1.3*e,0,TAU);ctx.fill();
}
function iconLock(x,y,s,col){
  ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.2,s*0.16);ctx.lineCap='round';
  ctx.beginPath();ctx.arc(x,y-s*0.18,s*0.3,PI,0);ctx.stroke();
  ctx.fillStyle=col;rr(x-s*0.45,y-s*0.18,s*0.9,s*0.66,s*0.14);ctx.fill();
}
// Header shared by both shop screens: back chip, coin balance, SKINS | TRAILS tabs.
function drawShopHeader(sl,active){
  ctx.fillStyle='#0a0a1a';ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  const b=sl.back;
  ctx.fillStyle='rgba(0,229,255,0.12)';rr(b.x,b.y,b.w,b.h,20);ctx.fill();
  ctx.fillStyle='#00e5ff';ctx.font='900 16px Rajdhani';ctx.fillText(L.back,b.x+b.w/2,b.y+26);
  // Coin balance
  ctx.font='900 16px Orbitron';
  const ct=fmtN(coins),cw=Math.max(88,ctx.measureText(ct).width+52);
  ctx.fillStyle='rgba(255,214,0,0.12)';rr(W-cw-12,b.y,cw,40,20);ctx.fill();
  iconCoin(W-cw-12+22,b.y+20,9);
  ctx.fillStyle='#ffd600';ctx.textAlign='right';ctx.fillText(ct,W-12-16,b.y+26);
  // Segmented tabs
  const t=sl.tabs,hw=t.w/2;
  ctx.fillStyle='rgba(255,255,255,0.06)';rr(t.x,t.y,t.w,t.h,t.h/2);ctx.fill();
  const ax=active==='skins'?t.x:t.x+hw;
  ctx.fillStyle='rgba(124,77,255,0.32)';rr(ax+2,t.y+2,hw-4,t.h-4,(t.h-4)/2);ctx.fill();
  ctx.strokeStyle='#b39dff';ctx.lineWidth=1.4;rr(ax+2,t.y+2,hw-4,t.h-4,(t.h-4)/2);ctx.stroke();
  ctx.textAlign='center';ctx.font='900 13px Orbitron';
  ctx.fillStyle=active==='skins'?'#fff':'rgba(255,255,255,0.5)';ctx.fillText(L.skins,t.x+hw/2,t.y+t.h*0.66,hw-16);
  ctx.fillStyle=active==='trails'?'#fff':'rgba(255,255,255,0.5)';ctx.fillText(L.trails,t.x+hw+hw/2,t.y+t.h*0.66,hw-16);
}
// Returns true when the tap hit the shared header (and was handled).
function shopHeaderTap(sl,x,y,active){
  if(inRect(sl.back,x,y)){state='menu';resetTouchState();sndMenu();return true;}
  if(inRect(sl.tabs,x,y)){
    const want=x<sl.tabs.x+sl.tabs.w/2?'skins':'trails';
    if(want!==active){
      if(want==='skins')openShop();else{state='trailselect';resetTouchState();}
      sndMenu();
    }
    return true;
  }
  return false;
}
function drawSkinSelect(){
  const sl=shopLayout();
  if(skinScroll>sl.maxScroll)skinScroll=sl.maxScroll;
  if(shopSel<0||shopSel>=SKINS.length)shopSel=currentSkin;

  ctx.fillStyle='rgba(255,255,255,0.045)';rr(pv.x,pv.y,pv.w,pv.h,16);ctx.fill();
  ctx.strokeStyle=rar.col;ctx.globalAlpha=0.7;ctx.lineWidth=1.6;rr(pv.x,pv.y,pv.w,pv.h,16);ctx.stroke();ctx.globalAlpha=1;
  ctx.textAlign='left';ctx.fillStyle='#fff';ctx.font='900 18px Orbitron';
  ctx.fillText(skinName(sk),pv.x+14,pv.y+28,pv.w-120);

  ctx.font='900 10px Orbitron';
  const rn=rarityName(sk).toUpperCase(),rw=ctx.measureText(rn).width+18;
  ctx.fillStyle=rar.col;ctx.globalAlpha=0.18;rr(pv.x+pv.w-rw-12,pv.y+12,rw,22,11);ctx.fill();ctx.globalAlpha=1;

  // Second line: how else this skin can be had
  ctx.textAlign='left';ctx.font='600 12px Rajdhani';

  else if(st.earnAt>0){ctx.fillStyle='rgba(120,220,255,0.85)';ctx.fillText(L.shopEarnHint.replace('{n}',fmtN(st.earnAt)),pv.x+14,pv.y+46,pv.w-28);}
  else if(isFeaturedSkin(shopSel)){ctx.fillStyle='#ffd600';glyphText('★︎ '+L.featured+'  -'+Math.round((1-FEATURED_DISCOUNT)*100)+'%',pv.x+14,pv.y+46);}
  // Snake
  const room=sl.btn.y-(pv.y+52),midY=pv.y+52+room/2;
  if(sk.p==='neon'){ctx.shadowColor=sk.c[0];ctx.shadowBlur=14;}
  drawSnakePreview(sk,W/2,midY,Math.min(210,pv.w-90),Math.min(10,room/2-5),22,Math.max(2,Math.min(7,room/2-13)));
  ctx.shadowBlur=0;
  // Action button (bottom-right)
  const bt=sl.btn;ctx.textAlign='center';
  if(st.owned){
    ctx.strokeStyle=st.equipped?'#00e676':'rgba(255,255,255,0.4)';ctx.lineWidth=1.6;rr(bt.x,bt.y,bt.w,bt.h,bt.h/2);ctx.stroke();
    ctx.fillStyle=st.equipped?'#00e676':'#fff';ctx.font='900 13px Orbitron';
    glyphText(st.equipped?'✓︎ '+L.trailEquipped:L.trailSelect,bt.x+bt.w/2,bt.y+bt.h*0.64,bt.w-16);
  }else if(st.canBuy){
    ctx.fillStyle='#00e676';ctx.shadowColor='#00e676';ctx.shadowBlur=10;rr(bt.x,bt.y,bt.w,bt.h,bt.h/2);ctx.fill();ctx.shadowBlur=0;
    ctx.fillStyle='#062014';ctx.font='900 14px Orbitron';
    coinText(L.shopBuy+'  🪙 '+fmtN(st.price),bt.x+bt.w/2,bt.y+bt.h*0.64,bt.w-16);
  }else{
    ctx.strokeStyle='rgba(255,214,0,0.35)';ctx.lineWidth=1.6;rr(bt.x,bt.y,bt.w,bt.h,bt.h/2);ctx.stroke();
    ctx.fillStyle='rgba(255,214,0,0.75)';ctx.font='900 14px Orbitron';
    coinText('🪙 '+fmtN(st.price),bt.x+bt.w/2,bt.y+bt.h*0.64,bt.w-16);
  }
  // Bottom-left: hero trial (rewarded ad), the way to close a coin gap, or how much is missing
  if(st.trial){
    const ab=sl.adBtn,ok=adReady.rewarded&&rewardPendingT<=0;
    ctx.globalAlpha=ok?1:0.45;
    ctx.fillStyle='rgba(0,255,200,0.12)';rr(ab.x,ab.y,ab.w,ab.h,ab.h/2);ctx.fill();
    ctx.strokeStyle='#00ffc8';ctx.lineWidth=1.6;rr(ab.x,ab.y,ab.w,ab.h,ab.h/2);ctx.stroke();
    ctx.fillStyle='#00ffc8';ctx.font='900 12px Orbitron';
    glyphText(trialSkin===shopSel?(isTR?'✓ SIRADAKİ OYUN':'✓ NEXT RUN'):(isTR?'▶ 1 OYUN DENE':'▶ TRY 1 RUN'),ab.x+ab.w/2,ab.y+ab.h*0.64,ab.w-14);
    ctx.globalAlpha=1;
  }else if(st.short>0){
    const ab=sl.adBtn;
    if(st.showAd){
      const ok=adReady.rewarded&&rewardPendingT<=0;
      ctx.globalAlpha=ok?1:0.45;
      ctx.strokeStyle='#00e676';ctx.lineWidth=1.6;rr(ab.x,ab.y,ab.w,ab.h,ab.h/2);ctx.stroke();
      ctx.fillStyle='#00e676';ctx.font='900 12px Orbitron';
      coinText('▶︎ '+L.shopAd+' +'+st.adReward+' 🪙',ab.x+ab.w/2,ab.y+ab.h*0.64,ab.w-14);

  // ── Grid ──
  ctx.save();ctx.beginPath();ctx.rect(0,sl.gy-4,W,sl.gh+4);ctx.clip();
  for(let c=0;c<SHOP_ORDER.length;c++){

    const skin=SKINS[i],rc=rarityOf(skin).col,owned=unlockedSkins.includes(i),sel=i===shopSel;
    ctx.fillStyle=sel?'rgba(255,255,255,0.10)':'rgba(255,255,255,0.04)';rr(r.x,r.y,r.w,r.h,12);ctx.fill();
    ctx.strokeStyle=rc;ctx.globalAlpha=sel?1:(owned?0.5:0.28);ctx.lineWidth=sel?2.2:1.2;
    if(sel){ctx.shadowColor=rc;ctx.shadowBlur=10;}
    rr(r.x,r.y,r.w,r.h,12);ctx.stroke();ctx.shadowBlur=0;
    const cx=r.x+r.w/2;
    ctx.globalAlpha=owned?1:0.62;
    drawSnakePreview(skin,cx,r.y+r.h*0.34,r.w*0.56,6,7,0);
    ctx.globalAlpha=1;ctx.textAlign='center';
    ctx.fillStyle=owned?'rgba(255,255,255,0.9)':'rgba(255,255,255,0.6)';ctx.font='700 11px Rajdhani';
    ctx.fillText(skinName(skin),cx,r.y+r.h-25,r.w-8);
    if(owned){
      if(i===currentSkin){ctx.fillStyle='#00e676';ctx.font='900 9px Orbitron';glyphText('✓︎ '+L.trailEquipped,cx,r.y+r.h-10,r.w-8);}
    }else{
      const pr=featuredSkinPrice(i);
      ctx.globalAlpha=coins>=pr?1:0.55;
      ctx.fillStyle='#ffd600';ctx.font='700 11px Rajdhani';coinText('🪙 '+fmtN(pr),cx,r.y+r.h-9,r.w-8);
      ctx.globalAlpha=1;
      iconLock(r.x+r.w-13,r.y+15,10,'rgba(255,255,255,0.45)');
    }
    if(isFeaturedSkin(i)){ctx.fillStyle='#ffd600';ctx.font='900 11px Rajdhani';ctx.textAlign='left';glyphText('★︎',r.x+7,r.y+17);}
  }
  ctx.restore();
  // Scrollbar
  if(sl.maxScroll>0){
    const sbY=sl.gy,sbH=sl.gh-10,thumbH=sbH*Math.min(1,sbH/(sbH+sl.maxScroll));
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(W-6,sbY,3,sbH);
    ctx.fillStyle='rgba(255,255,255,0.45)';ctx.fillRect(W-6,sbY+(skinScroll/sl.maxScroll)*(sbH-thumbH),3,thumbH);
  }
  ctx.textAlign='left';
}

// ═══ TRAIL SELECT (cosmetic axis #2) ═══
// One source of truth for each trail row's hit-rect (draw + tap share it).
function trailRowRect(i){
  const oy=sat,rowH=Math.min(64,Math.floor((H-sat-sab-150)/TRAILS.length));
  const rw=Math.min(320,W-32),rx=W/2-rw/2,ry=oy+116+i*(rowH+8);
  return{x:rx,y:ry,w:rw,h:rowH};
}
// Static preview dots representing a trail style (no pooled state — pure paint).
function drawTrailPreview(td,cx,cy){
  const id=td.id;
  if(id==='none'){ctx.fillStyle='rgba(255,255,255,0.25)';ctx.font='600 11px Rajdhani';ctx.textAlign='center';ctx.fillText('—',cx,cy+3);return;}
  for(let j=0;j<6;j++){
    const px=cx-18+j*7,t=j/6;let c;
    if(id==='rainbow'){const rc=_hslToRgb((j*55+frameCount*4)%360,0.85,0.6);c='rgb('+rc.r+','+rc.g+','+rc.b+')';}
    else if(id==='embers'){c='rgb(255,'+(90+j*14)+',0)';}
    else c=td.col;
    ctx.fillStyle=c;ctx.globalAlpha=0.4+t*0.6;
    ctx.beginPath();ctx.arc(px,cy+Math.sin(frameCount*0.1+j)*2,3.4-t*1.6,0,TAU);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function drawTrailSelect(){
  drawShopHeader(shopLayout(),'trails');
  // Rows
  for(let i=0;i<TRAILS.length;i++){
    const td=TRAILS[i],r=trailRowRect(i);
    const owned=unlockedTrails.indexOf(i)>=0,equipped=i===currentTrail;
    ctx.fillStyle=equipped?'rgba(124,77,255,0.18)':'rgba(255,255,255,0.05)';
    rr(r.x,r.y,r.w,r.h,10);ctx.fill();
    ctx.strokeStyle=equipped?'#b39dff':(owned?'rgba(255,255,255,0.18)':'rgba(255,255,255,0.10)');
    ctx.lineWidth=equipped?2:1.2;rr(r.x,r.y,r.w,r.h,10);ctx.stroke();
    // Preview swatch (left)
    drawTrailPreview(td,r.x+44,r.y+r.h/2);
    // FEATURED highlight on this week's featured trail row (gold pulse + badge).
    if(isFeaturedTrail(i)){
      const pulse=reducedMotion?0:0.18+0.12*Math.sin(frameCount*0.12);
      ctx.strokeStyle='rgba(255,214,0,'+(0.55+pulse)+')';ctx.lineWidth=2;rr(r.x,r.y,r.w,r.h,10);ctx.stroke();
      ctx.textAlign='left';ctx.fillStyle='#ffd600';ctx.font='900 9px Rajdhani';
      glyphText('★︎ '+L.featured,r.x+86,r.y+13);
    }
    // Name (center-left)
    ctx.textAlign='left';ctx.fillStyle=owned?'#fff':'rgba(255,255,255,0.55)';ctx.font='700 15px Rajdhani';
    ctx.fillText(trailName(td),r.x+86,r.y+r.h/2+5);
    // Right side: EQUIPPED / price / SELECT
    ctx.textAlign='right';
    if(equipped){ctx.fillStyle='#b39dff';ctx.font='900 12px Rajdhani';glyphText('✓︎ '+L.trailEquipped,r.x+r.w-16,r.y+r.h/2+4);}
    else if(owned){ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='700 13px Rajdhani';ctx.fillText(L.trailSelect,r.x+r.w-16,r.y+r.h/2+4);}
    else{const tp=featuredTrailPrice(i);ctx.globalAlpha=coins>=tp?1:0.5;ctx.fillStyle='#ffd600';ctx.font='900 14px Orbitron';coinText('🪙 '+fmtN(tp),r.x+r.w-16,r.y+r.h/2+4);ctx.globalAlpha=1;}
    ctx.textAlign='left';

// ═══ INPUT ═══
// touches: { [identifier:number]: 'joy' | 'joyboost' } — ONLY numeric identifiers,
// never any other keys. Keep that invariant so iteration doesn't need a guard.
let touches={};
// Skin-select scroll uses its own state instead of stuffing a string key into
// the touches map (used to be touches._lastY which made every iteration need
// a `k !== '_lastY'` filter).
let skinScrollLastY=null;
let achScrollLastY=null;
let lastTapEndAt=0,lastTapX=0,lastTapY=0;
const DOUBLE_TAP_MS=320,DOUBLE_TAP_DIST=100;
$.addEventListener('touchstart',function(e){
  e.preventDefault();initAudio();
  const t=e.changedTouches[0];
  // Nothing underneath a full-screen ad may react to touches.
  if(adBlocksInput())return;
  // Tutorial overlay can be shown over any state (initial spawn or pause-launched).
  // A single tap dismisses it and returns control to the underlying screen.
  if(showTutorial){handleGuideTap(t.clientX,t.clientY);return;}
  if(privacyPrimerOpen){handlePrimerTap(t.clientX,t.clientY);return;}
  if(state==='menu'){handleMenuTap(t.clientX,t.clientY);return;}
  if(state==='dead'){handleDeathTap(t.clientX,t.clientY);return;}
  if(state==='paused'){handlePauseTap(t.clientX,t.clientY);return;}
  if(state==='leaderboard'){handleLeaderboardTap(t.clientX,t.clientY);return;}
  if(state==='achievements'){handleAchievementsTap(t.clientX,t.clientY);achScrollLastY=t.clientY;return;}
  // The skin grid scrolls, so a tap only counts on release (see onTouchEnd).
  if(state==='skinselect'){shopTouch={x:t.clientX,y:t.clientY,moved:false,grid:t.clientY>=shopLayout().gy};skinScrollLastY=t.clientY;return;}
  if(state==='trailselect'){handleTrailTap(t.clientX,t.clientY);return;}
  if(state==='modeselect'){handleModeselectTap(t.clientX,t.clientY);return;}
  if(state==='chapters'){handleChaptersTap(t.clientX,t.clientY);return;}
  if(state==='chapterwin'){handleChapterWinTap(t.clientX,t.clientY);return;}
  if(state==='playing'){
    // Pause button (bottom-left) — only remaining HUD button
    if(dist({x:t.clientX,y:t.clientY},{x:50,y:H-sab-60})<34){pauseGame();return;}
    // If a second finger is already on screen → boost while held
    let extraFinger=false;for(const k in touches){if(touches[k]){extraFinger=true;break;}}
    // A second finger while steering is BOOST ONLY. It must never take over
    // the joystick anchor, or both fingers would steer against one anchor and
    // the snake snaps toward "thumb A relative to thumb B".
    if(extraFinger&&joystick.active){
      if(player&&player.alive){player.boosting=true;sndBoost();}
      touches[t.identifier]='boost';
      return;
    }
    // Double-tap-and-hold: tap recently, this touch begins quickly nearby → boost
    const now=performance.now();
    const isDoubleTap=(now-lastTapEndAt<DOUBLE_TAP_MS)&&Math.hypot(t.clientX-lastTapX,t.clientY-lastTapY)<DOUBLE_TAP_DIST;
    const wantBoost=extraFinger||isDoubleTap;
    if(wantBoost&&player&&player.alive){player.boosting=true;sndBoost();}
    // Joystick anchor at this touch (so direction is whatever the player drags toward)
    joystick.active=true;joystick.cx=t.clientX;joystick.cy=t.clientY;joystick.dx=0;joystick.dy=0;
    touches[t.identifier]=wantBoost?'joyboost':'joy';
  }
},{passive:false});

$.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(showSettings&&settingsDrag){const t=e.changedTouches[0],sl=settingsLayout();if(settingsDrag==='sfx')setSfx(sliderValue(sl.sfx,t.clientX));else setMusic(sliderValue(sl.music,t.clientX));return;}
  if(state==='skinselect'){
    const t=e.changedTouches[0];
    if(shopTouch){
      if(Math.abs(t.clientY-shopTouch.y)>8||Math.abs(t.clientX-shopTouch.x)>8)shopTouch.moved=true;
      if(shopTouch.grid&&shopTouch.moved&&skinScrollLastY!=null){
        skinScroll=Math.max(0,Math.min(shopLayout().maxScroll,skinScroll-(t.clientY-skinScrollLastY)));
      }
    }
    skinScrollLastY=t.clientY;return;
  }
  if(state==='achievements'){const t=e.changedTouches[0];achScroll-=t.clientY-(achScrollLastY!=null?achScrollLastY:t.clientY);achScroll=Math.max(0,Math.min(achScroll,Math.max(0,ACHIEVEMENTS.length*64-(H-sat-sab-136))));achScrollLastY=t.clientY;return;}
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const kind=touches[t.identifier];
    if((kind==='joy'||kind==='joyboost')&&joystick.active){
      let dx=t.clientX-joystick.cx,dy=t.clientY-joystick.cy;
      const d=Math.sqrt(dx*dx+dy*dy);if(d>JOY_RADIUS){dx=dx/d*JOY_RADIUS;dy=dy/d*JOY_RADIUS;}
      joystick.dx=dx;joystick.dy=dy;
      if(d>JOY_DEAD&&player){joystick.angle=Math.atan2(dy,dx);player.targetAngle=joystick.angle;}
    }
  }
},{passive:false});

// Shared by touchend AND touchcancel: iOS cancels touches on a home-swipe,
// Control Center pull or banner; without handling it the touch would stay in
// `touches` forever and every later steering touch would count as a boost.
function onTouchEnd(e){
  e.preventDefault();
  if(settingsDrag){settingsDrag=null;saveSettings();sndMenu();}
  if(shopTouch){
    const st=shopTouch,ct=e.changedTouches[0];shopTouch=null;
    if(state==='skinselect'&&e.type==='touchend'&&!st.moved&&ct&&!adBlocksInput())handleSkinTap(ct.clientX,ct.clientY);
  }
  for(let i=0;i<e.changedTouches.length;i++){
    const t=e.changedTouches[i];
    const kind=touches[t.identifier];
    if((kind==='joyboost'||kind==='boost')&&player){
      let otherBoost=false;
      for(const k in touches){if(k!==String(t.identifier)&&(touches[k]==='boost'||touches[k]==='joyboost')){otherBoost=true;break;}}
      if(!otherBoost)player.boosting=false;
    }
    // Track recent finger-up for double-tap-hold detection
    if(state==='playing'&&kind==='joy'){lastTapEndAt=performance.now();lastTapX=t.clientX;lastTapY=t.clientY;}
    delete touches[t.identifier];
  }
  // After removing this touch, recompute who owns the joystick.
  // If any joy/joyboost touch is still down, transfer joystick anchor to it
  // so the player can lift one finger but keep steering with the other.
  let owner=null;for(const k in touches){const v=touches[k];if(v==='joy'||v==='joyboost'){owner=k;break;}}
  if(owner==null){
    joystick.active=false;
    if(player)player.boosting=false;
  }
  // (joystick anchor is updated in touchstart; on transfer, the stick keeps
  //  its previous direction until the surviving finger moves and re-anchors.)
  skinScrollLastY=null;achScrollLastY=null;
}
$.addEventListener('touchend',onTouchEnd,{passive:false});
$.addEventListener('touchcancel',onTouchEnd,{passive:false});

// Pause / resume go through one place so touch state is always cleared and the
// resume shield is rate-limited (pause-spamming must not grant invulnerability).
function pauseGame(){
  if(state!=='playing')return;
  state='paused';resetTouchState();quitConfirmTimer=0;sndMenu();
}
function resumeGame(){
  if(state!=='paused')return;
  state='playing';quitConfirmTimer=0;resetTouchState();
  if(player&&playTime-lastResumeShieldAt>=12){player.invulnTimer=Math.max(player.invulnTimer,1.2);lastResumeShieldAt=playTime;}
}

function handleMenuTap(x,y){

  // Missions panel swallows taps when open.
  if(showMissionsPanel){handleMissionsPanelTap(x,y);return;}
  // Settings overlay swallows taps when open.
  if(showSettings){
    const sl=settingsLayout();
    if(inRect(sl.sfx,x,y)){settingsDrag='sfx';setSfx(sliderValue(sl.sfx,x));return;}
    if(inRect(sl.music,x,y)){settingsDrag='music';setMusic(sliderValue(sl.music,x));return;}
    if(inRect(sl.vib,x,y)){vibrationOn=!vibrationOn;saveSettings();sndMenu();return;}
    if(inRect(sl.motion,x,y)){reducedMotion=!reducedMotion;saveSettings();sndMenu();return;}
    if(inRect(sl.lang,x,y)){LANG_PREF_NEXT=LANG_PREF_NEXT==='auto'?'tr':(LANG_PREF_NEXT==='tr'?'en':'auto');sndMenu();return;}
    if(inRect(sl.done,x,y)){
      saveSettings();sndMenu();showSettings=false;
      // A new language needs a fresh start (every string is built at load).
      if(LANG_PREF_NEXT!==LANG_PREF){saveStats();saveCoins();setTimeout(function(){location.reload();},120);}
      return;
    }
    if(sl.privacy&&inRect(sl.privacy,x,y)){sndMenu();postMsg({type:'OPEN_PRIVACY_OPTIONS'});return;}
    // Taps elsewhere are swallowed while the overlay is open.
    return;
  }
  const ml=menuLayout();
  if(inRect(ml.settings,x,y)){showSettings=true;sndMenu();return;}
  if(inRect(ml.help,x,y)){guidePage=0;showTutorial=true;sndMenu();return;}
  if(inRect(ml.play,x,y)){sndMenu();startGame(mode);return;}
  if(inRect(ml.mode,x,y)){sndMenu();state='modeselect';resetTouchState();return;}
  if(inRect(ml.cosmetics,x,y)||inRect(ml.hero,x,y)){sndMenu();openShop();return;}
  if(inRect(ml.leaderboard,x,y)){sndMenu();state='leaderboard';return;}
  if(inRect(ml.missions,x,y)){if(missions&&missions.length===3){showMissionsPanel=true;sndMenu();}return;}
  if(inRect(ml.daily,x,y)){showDailyModal=true;sndMenu();return;}
  if(inRect(ml.ad,x,y)){
    sndMenu();
    if(coinAdsLeft()<=0){showToast(L.coinAdCap,'info');return;}
    requestRewarded('coins');return;
  }
  // Taps on empty space do nothing (no sound, no haptic).
}
function handlePauseTap(x,y){
  const uh=H-sat-sab,oy=sat;
  const bw=Math.min(260,W-40),bh=Math.min(52,Math.floor(uh*0.08)),bx=W/2-bw/2;
  // If the confirm modal is up, only Yes/No respond.
  if(quitConfirmTimer>0){
    const mw=Math.min(320,W-40),mh=Math.min(168,H-sat-sab-40);
    const mx=W/2-mw/2,my=Math.max(sat+20,(H-mh)/2);
    const cbw=120,cbh=48,cy=my+mh-cbh-20;
    if(x>mx+20&&x<mx+20+cbw&&y>cy&&y<cy+cbh){quitConfirmTimer=0;settleRun();track('run_quit',{mode:mode,score:score,time:Math.floor(playTime)});goMenu();sndMenu();return;}
    if(x>mx+mw-cbw-20&&x<mx+mw-20&&y>cy&&y<cy+cbh){quitConfirmTimer=0;sndMenu();return;}
    return;
  }
  sndMenu();
  // Resume
  let ry=oy+uh*0.20;
  if(x>bx&&x<bx+bw&&y>ry&&y<ry+bh){resumeGame();return;}
  // Settings pills row
  ry=oy+uh*0.34;
  const pillW=Math.floor(bw/4)-6,pillGap=9;
  const totalPills=pillW*4+pillGap*3,pillsX=W/2-totalPills/2;
  if(y>ry&&y<ry+bh){
    const pillsXEnd=pillsX+pillW;
    const pill2X=pillsX+pillW+pillGap,pill2XEnd=pill2X+pillW;
    const pill3X=pillsX+2*(pillW+pillGap),pill3XEnd=pill3X+pillW;
    const pill4X=pillsX+3*(pillW+pillGap),pill4XEnd=pill4X+pillW;
    if(x>pillsX&&x<pillsXEnd){toggleSfx();return;}
    if(x>pill2X&&x<pill2XEnd){toggleMusic();return;}
    if(x>pill3X&&x<pill3XEnd){vibrationOn=!vibrationOn;saveSettings();return;}
    if(x>pill4X&&x<pill4XEnd){reducedMotion=!reducedMotion;saveSettings();return;}
  }
  // How to play
  ry=oy+uh*0.50;
  if(x>bx&&x<bx+bw&&y>ry&&y<ry+bh){guidePage=0;showTutorial=true;return;}
  // Main menu (open confirm)
  ry=oy+uh*0.64;
  if(x>bx&&x<bx+bw&&y>ry&&y<ry+bh){quitConfirmTimer=10;return;}
}

function handleDeathTap(x,y){
  // Ignore taps until the screen has faded in (a boost double-tap in flight at
  // the moment of death must not land on Revive / Play Again), and while an
  // interstitial requested from this screen is pending or on screen.
  if(deathInputLock>0)return;
  if(afterAdAction){if(afterAdShown&&!adOpen&&afterAdT>2)finishAfterAd();return;}
  const dl=deathLayout();
  // Revive (once per run, rewarded ad)

  // Double your coins (rewarded, once per settlement)

  if(inRect(dl.again,x,y)){sndMenu();leaveDeathScreen(function(){startGame();});return;}

function handleSkinTap(x,y){
  const sl=shopLayout();
  if(shopHeaderTap(sl,x,y,'skins'))return;
  const st=shopSkinState(shopSel);
  // Action button: buy (owned skins are equipped by tapping their card)
  if(inRect(sl.btn,x,y)){
    if(st.owned){if(!st.equipped){currentSkin=shopSel;saveStats();saveSkins();}sndMenu();return;}
    if(st.canBuy){
      // Re-check everything at the moment of purchase; the price charged is the
      // price drawn (both come from featuredSkinPrice).
      const idx=shopSel,p=featuredSkinPrice(idx);
      if(p>0&&!unlockedSkins.includes(idx)&&coins>=p){
        coins-=p;unlockedSkins.push(idx);currentSkin=idx;saveCoins();saveSkins();saveStats();
        sndPowerup();showToast(skinName(SKINS[idx])+' ✓','success');
        track('skin_buy',{skin:SKINS[idx].name,price:p});
      }
      return;
    }
    sndDeath();showToast(L.shopNeed.replace('{n}',fmtN(st.short)),'error');return;
  }
  // Hero trial: one run in this skin after a rewarded ad
  if(st.trial&&inRect(sl.adBtn,x,y)){sndMenu();if(trialSkin!==shopSel){pendingTrial=shopSel;requestRewarded('trial');}return;}
  // Rewarded ad that closes a coin gap
  if(st.showAd&&inRect(sl.adBtn,x,y)){sndMenu();requestRewarded('coins');return;}
  // Grid: an owned skin is equipped, a locked one is selected for preview
  if(y<sl.gy)return;
  for(let c=0;c<SHOP_ORDER.length;c++){
    if(!inRect(shopCellRect(sl,c),x,y))continue;
    const i=SHOP_ORDER[c];
    shopSel=i;
    if(unlockedSkins.includes(i)&&currentSkin!==i){currentSkin=i;saveStats();saveSkins();}
    sndMenu();return;
  }
}

// ═══ AUTO-PAUSE (background / focus loss / phone call / notification) ═══
function autoPauseIfPlaying(){
  if(state==='playing'){
    state='paused';
    if(player)player.boosting=false;
    joystick.active=false;
    for(const k in touches)delete touches[k];
    quitConfirmTimer=0;
    // Coins earned so far live only in memory until the run ends: persist them
    // now so a swipe-kill while backgrounded does not lose the run's earnings.
    saveCoins();saveStats();
  }
  // Always halt music tick on background — saves CPU + battery, avoids
  // overlapping notes when the WebView resumes. Ad-ready poll also stops
  // (the host pushes status when it changes; foreground polling is just a
  // safety net we don't need while hidden).
  stopMusic();
  stopAdReadyPoll();
}
function resumeFromBackground(){
  lt=0;
  checkDayRollover();
  if(musicOn&&ac&&ac.state!=='suspended')startMusic();
  startAdReadyPoll();
  if(hostBridgeSeen)postMsg({type:'CHECK_AD_READY'});
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden)autoPauseIfPlaying();else resumeFromBackground();
});

// ═══ GAME LOOP ═══
let lt=0;
// One bad frame must never stop the game: an exception thrown out of update()
// or render() used to end the rAF chain and leave a frozen screen. It is caught,
// reported once per session, and the next frame runs normally.
let frameErrorReported=false;
function loop(ts){
  requestAnimationFrame(loop);
  if(!lt)lt=ts;
  const d=Math.min((ts-lt)/1000,0.05);lt=ts;
  try{
    // While a full-screen ad covers the game nothing may advance underneath it.
    if(!adOpen)update(d);
    hostSync();
    render();
  }catch(e){
    try{ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;ctx.shadowBlur=0;}catch(e2){}
    if(!frameErrorReported){frameErrorReported=true;track('frame_error',{msg:String(e&&e.message||e).slice(0,90),st:state});}
  }
}
// Start once the embedded fonts are decoded (canvas text measured with a
// fallback font would shift every hand-tuned layout), with a hard timeout so a
// font failure can never keep the game from starting.
(function(){
  let started=false;
  const start=function(){if(started)return;started=true;requestAnimationFrame(loop);};
  try{
    Promise.all([
      document.fonts.load('900 20px Orbitron'),document.fonts.load('700 20px Orbitron'),
      document.fonts.load('700 16px Rajdhani'),document.fonts.load('600 16px Rajdhani'),
      document.fonts.load('600 16px Rajdhani','ğşİ'),document.fonts.load('700 16px Rajdhani','ğşİ')
    ]).then(start,start);
  }catch(e){start();}
  setTimeout(start,1500);
})();
</script>
